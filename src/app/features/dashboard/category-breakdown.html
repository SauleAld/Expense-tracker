<app-chart-card title="Spending by category" [subtitle]="periodLabel()" [tableView]="false">
  <div actions class="-mt-1 -mr-2 flex shrink-0 items-center">
    <button type="button" class="icon-btn size-8 disabled:opacity-30" aria-label="Previous month" [disabled]="!canPrev()" (click)="step.emit(-1)">
      <app-icon name="chevron-left" [size]="18" />
    </button>
    <button type="button" class="icon-btn size-8 disabled:opacity-30" aria-label="Next month" [disabled]="!canNext()" (click)="step.emit(1)">
      <app-icon name="chevron-right" [size]="18" />
    </button>
  </div>
  <div chart>
    @if (total() > 0) {
      <p class="mb-3 flex items-baseline justify-between gap-3" aria-live="polite">
        <span class="text-sm text-ink-2">Total · {{ pluralize(count(), 'expense') }}</span>
        <span class="text-xl font-semibold tracking-tight tabular-nums">{{ formatCurrency(total()) }}</span>
      </p>
      <div class="relative" (pointerleave)="onLeave($event)">
        <div class="flex h-4 gap-0.5 overflow-hidden rounded" role="img" [attr.aria-label]="'Share of spending by category: ' + summary()">
          @for (segment of segments(); track segment.category) {
            <div
              class="min-w-1 basis-0 cursor-pointer transition-opacity focus-visible:-outline-offset-2"
              tabindex="0"
              role="button"
              [style.flex-grow]="segment.total"
              [style.background-color]="segment.color"
              [class.opacity-40]="(active() ?? selected()) !== null && (active() ?? selected()) !== segment.category"
              [attr.aria-pressed]="selected() === segment.category"
              [attr.aria-label]="segment.category + ': ' + formatCurrency(segment.total) + ', ' + percent(segment.share) + '. Show expenses'"
              (pointerenter)="active.set(segment.category)"
              (focus)="active.set(segment.category)"
              (blur)="active.set(null)"
              (click)="select.emit(segment.category)"
              (keydown.enter)="select.emit(segment.category)"
              (keydown.space)="$event.preventDefault(); select.emit(segment.category)"
            ></div>
          }
        </div>
        @if (tooltip(); as tip) {
          <app-chart-tooltip [x]="tip.x" y="0px" [title]="tip.title" [rows]="tip.rows" />
        }
      </div>

      <ul class="mt-4 space-y-0.5" (pointerleave)="onLeave($event)">
        @for (row of ranked(); track row.category) {
          <li class="-mx-2" (pointerenter)="active.set(row.category)">
            <button
              type="button"
              class="flex w-full items-center gap-3 rounded-lg px-2 py-1.5 text-left transition-colors hover:bg-subtle"
              [class.bg-subtle]="active() === row.category"
              [class.ring-1]="selected() === row.category"
              [class.ring-line-strong]="selected() === row.category"
              [attr.aria-pressed]="selected() === row.category"
              [attr.aria-label]="row.category + ', ' + formatCurrency(row.total) + '. Show expenses'"
              (click)="select.emit(row.category)"
            >
              <span class="size-2.5 shrink-0 rounded-sm" [style.background-color]="row.color"></span>
              <span class="min-w-0 flex-1 truncate text-sm text-ink">{{ row.category }}</span>
              <span class="text-sm font-medium tabular-nums">{{ formatCurrency(row.total) }}</span>
              <span class="w-10 text-right text-xs text-ink-2 tabular-nums">{{ percent(row.share) }}</span>
            </button>
          </li>
        }
      </ul>
    } @else {
      <p class="py-10 text-center text-sm text-ink-2" aria-live="polite">No spending recorded for {{ periodLabel() }}.</p>
    }
  </div>
</app-chart-card>
