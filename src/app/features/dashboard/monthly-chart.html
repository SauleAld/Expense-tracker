<app-chart-card title="Monthly spending" [subtitle]="'Last ' + data().length + ' months'">
  <div chart appMeasure class="relative" (pointerleave)="onLeave($event)">
    <svg
      class="block"
      role="img"
      [attr.aria-label]="summary()"
      [attr.width]="width()"
      [attr.height]="height"
    >
      @for (line of geometry().grid; track line.label) {
        <line
          [class]="line.isBaseline ? 'stroke-line-strong' : 'stroke-line'"
          stroke-width="1"
          [attr.x1]="margin.left"
          [attr.x2]="geometry().right"
          [attr.y1]="line.y"
          [attr.y2]="line.y"
        />
        <text class="fill-muted text-[11px]" text-anchor="end" dominant-baseline="middle" [attr.x]="margin.left - 8" [attr.y]="line.y">
          {{ line.label }}
        </text>
      }

      @for (bar of geometry().bars; track bar.point.key) {
        <path
          class="transition-colors"
          [class]="bar.isCurrent || hover() === bar.index ? 'fill-series-1' : 'fill-series-past'"
          [attr.d]="bar.path"
        />
        <text
          class="text-[11px]"
          [class]="bar.isCurrent ? 'fill-ink font-medium' : 'fill-muted'"
          text-anchor="middle"
          [attr.x]="bar.cx"
          [attr.y]="height - 8"
        >
          {{ bar.point.label }}
        </text>
        @if (bar.isCurrent && bar.h > 0) {
          <text class="fill-ink text-xs font-semibold" text-anchor="middle" [attr.x]="bar.cx" [attr.y]="bar.y - 7">
            {{ formatWhole(bar.point.total) }}
          </text>
        }
      }

      <!-- Hit areas: full-height bands, larger than the bars themselves. -->
      @for (bar of geometry().bars; track bar.point.key) {
        <rect
          class="cursor-default fill-transparent"
          tabindex="0"
          role="img"
          [attr.aria-label]="bar.aria"
          [attr.x]="bar.bandX"
          [attr.y]="margin.top"
          [attr.width]="geometry().band"
          [attr.height]="geometry().plotH"
          (pointerenter)="hover.set(bar.index)"
          (focus)="hover.set(bar.index)"
          (blur)="hover.set(null)"
        />
      }
    </svg>

    @if (tooltip(); as tip) {
      <app-chart-tooltip [x]="tip.x" [y]="tip.y" [title]="tip.title" [rows]="tip.rows" />
    }
  </div>

  <div table class="overflow-x-auto">
    <table class="w-full text-sm">
      <caption class="sr-only">Monthly spending totals</caption>
      <thead>
        <tr class="text-left text-xs text-ink-2">
          <th scope="col" class="pb-2 font-medium">Month</th>
          <th scope="col" class="pb-2 text-right font-medium">Expenses</th>
          <th scope="col" class="pb-2 text-right font-medium">Total</th>
        </tr>
      </thead>
      <tbody>
        @for (d of data(); track d.key) {
          <tr class="border-t border-line">
            <th scope="row" class="py-2 text-left font-normal">{{ d.longLabel }}</th>
            <td class="py-2 text-right text-ink-2 tabular-nums">{{ d.count }}</td>
            <td class="py-2 text-right font-medium tabular-nums">{{ formatCurrency(d.total) }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</app-chart-card>
